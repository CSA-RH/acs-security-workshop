# 04-central.yaml
# Purpose: Deploys RHACS Central services (Central, Central DB, Scanner V4) and
# exposes the portal through an OpenShift Route. Scanner V4 is the scanner the
# workshop uses for image, node, and SBOM data.
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
spec:
  central:
    db:
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 256m
          memory: 50Mi
    exposure:
      route:
        enabled: true
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 256m
        memory: 512Mi
  scanner:
    scannerComponent: Disabled
  scannerV4:
    indexer:
      resources:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 256m
          memory: 50Mi
      scaling:
        autoScaling: Disabled
        replicas: 1
    matcher:
      resources:
        limits:
          cpu: 2
          memory: 4Gi
        requests:
          cpu: 256m
          memory: 50Mi
      scaling:
        autoScaling: Disabled
        replicas: 1
    scannerComponent: Enabled

# 05-secured-cluster.yaml
# Purpose: Deploys the secured cluster services (Sensor, Collector, Admission
# Controller, Scanner V4 indexer) on the same cluster that runs Central.
# Apply this only after the cluster registration secret (CRS) is in the stackrox
# namespace (see README step 6).
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
spec:
  clusterName: workshop-cluster
  centralEndpoint: central.stackrox.svc:443
  admissionControl:
    # Enforcement of policies that have enforcement enabled (default on new 4.9+ installs).
    # Kept explicit here because step 05 depends on it.
    enforcement: Enabled
    replicas: 1
  sensor:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 256m
        memory: 50Mi
  scannerV4:
    # AutoSense reuses the Scanner V4 deployed with Central in the same namespace.
    scannerComponent: AutoSense


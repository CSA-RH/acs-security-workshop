# 05-node-agent.yaml
# Purpose: "Monitoring agent" that is set up as badly as possible: an outdated UBI 8.4
# base image (2021), a privileged container, the host root filesystem mounted, and host
# PID and host network namespaces. Even though it is not exposed, RHACS ranks it near
# the top of the Risk view.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-agent
  namespace: acs-workshop
  labels:
    app: node-agent
    app.kubernetes.io/part-of: acs-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      serviceAccountName: node-agent
      hostPID: true
      hostNetwork: true
      containers:
        - name: agent
          image: registry.access.redhat.com/ubi8/ubi:8.4
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
